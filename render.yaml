services:
  - type: web
    name: optera-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: gunicorn optera.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: optera-db
          property: connectionString

databases:
  - name: optera-db
    plan: free
    region: oregon
    databaseName: optera
    user: optera
