services:
  - type: web
    name: optera-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: bash -c "mkdir -p /var/data/media && cp -rn media/. /var/data/media/ 2>/dev/null || true; gunicorn optera.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SERVE_MEDIA
        value: "True"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: optera-db
          property: connectionString
    disks:
      - name: media
        mountPath: /var/data
        sizeGB: 1

databases:
  - name: optera-db
    plan: free
    region: oregon
    databaseName: optera
    user: optera
