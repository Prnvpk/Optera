{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTERA</title>
    <link href="{% static 'css/product.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">


</head>
<body>
    <header class="topbar sticky-top">
        <a href="/index" class="logo">OPTERA</a>
        <nav>
            <div class="navbar-nav">
                <a href="/index">Home</a>
                <a href="/product">Products</a>
                <a href="/profile">
                    <i class="bi bi-person-circle"></i>
                </a>
                <a href="{% url 'cart' %}">
                    <i class="bi bi-cart"></i>
                </a>
                <a href="{% url 'user_order_status' %}">
                    <i class="bi bi-box"></i>
                </a>
                <a href="{% url 'logout' %}">Logout</a>
            </div>
        </nav>
    </header>
    
    <div class="container">


    <form method="get" class="search-box">
        <input type="text" name="q" placeholder="Search products..." value="{{ query|default:'' }}">
        <button type="submit">Search</button>
    </form>

    
    <div class="products">
        {% for product in products %}
        <div class="card">
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
            <h3>{{ product.product_name }}</h3>
            <p class="price">₹{{ product.price }}</p>
            <p>{{ product.description|truncatechars:60 }}</p>

            <a class="btn" href="{% url 'add_to_cart' product.id %}">Add to Cart</a>
            <a class="btn" href="productbuy/{{product.id}}">buy</a>


        </div>
        {% empty %}
        <p>No products found</p>
        {% endfor %}
    </div>

</body>
</html>
